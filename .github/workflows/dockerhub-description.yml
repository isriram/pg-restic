name: Update Docker Hub description

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: sriramiyer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sriramiyer/pg-restic
          short-description: "Back up Postgres to S3 or Backblaze B2 on a schedule with restic. Encrypted, deduplicated snapshots."
